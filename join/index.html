<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>You're invited to an Outlier game</title>
<meta name="description" content="Join the game in Outlier: Party Game.">
<meta property="og:title" content="You're invited to an Outlier game">
<meta property="og:description" content="Tap to join the room in Outlier: Party Game.">
<meta property="og:image" content="https://outlierpartygames.github.io/assets/og.png">
<meta property="og:url" content="https://outlierpartygames.github.io/join/">
<meta name="twitter:card" content="summary_large_image">
<style>
@font-face{font-family:Anton;src:url(../assets/anton.ttf) format("truetype");font-display:swap}
@font-face{font-family:Oswald;font-weight:600;src:url(../assets/oswald-600.ttf) format("truetype");font-display:swap}
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f1efea url(../assets/wallpaper.jpg) center top/cover}
body{font-family:Oswald,"Arial Narrow",Arial,sans-serif;color:#111;display:flex;justify-content:center}
main{width:100%;max-width:420px;padding:56px 22px 32px;display:flex;flex-direction:column;align-items:center}
.logo{width:250px;max-width:80%;margin-bottom:18px}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:34px;letter-spacing:.5px;margin:0 0 18px}
.lab{font-weight:600;font-size:15px;letter-spacing:3px;color:#666;margin-bottom:6px}
.code{display:flex;gap:9px;margin:4px 0 26px}
.code span{width:52px;height:64px;background:#fff;border:3.5px solid #111;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.25);font-family:Anton,Impact,sans-serif;font-size:38px;display:flex;align-items:center;justify-content:center}
.btn{width:100%;height:58px;border:3px solid #111;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #111;margin-bottom:16px;position:relative;overflow:hidden;text-decoration:none}
.btn span{font-family:Anton,Impact,sans-serif;font-size:26px;letter-spacing:.5px;position:relative;color:#fff;-webkit-text-stroke:5px #111;paint-order:stroke fill}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #111}
.red{background:#E2231A}.red:after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:#B81812}
.dark{background:#3d3d3d}.dark:after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:#2a2a2a}
.help{width:100%;background:#fff;border:3px solid #111;border-radius:14px;padding:12px 16px;font-weight:600;font-size:16px;line-height:1.5;color:#333;text-align:center}
.hidden{display:none!important}
</style></head>
<body><main>
<img class="logo" src="../assets/logo.png" alt="Outlier">
<h1>YOU'RE INVITED!</h1>
<div id="room"><div class="lab" style="text-align:center">ROOM CODE</div><div class="code" id="code" aria-label="Room code"></div></div>
<a class="btn red" id="open" href="outlier://join"><span>OPEN GAME</span></a>
<a class="btn dark" href="https://apps.apple.com/app/id6819834243"><span>GET OUTLIER FREE</span></a>
<div class="help">No app yet? Get Outlier, then tap your invite link again to join.</div>
</main>
<script>
(function () {
  var raw = new URLSearchParams(location.search).get('code') || '';
  var code = raw.trim().toUpperCase();
  if (!/^[A-Z0-9]{5}$/.test(code)) { document.getElementById('room').classList.add('hidden'); return; }
  var box = document.getElementById('code');
  code.split('').forEach(function (c) { var s = document.createElement('span'); s.textContent = c; box.appendChild(s); });
  document.getElementById('open').href = 'outlier://join?code=' + encodeURIComponent(code);
  document.title = "You're invited to an Outlier game (" + code + ")";
})();
</script>
</body></html>
